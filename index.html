<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Gateway</title>
    <script>
        function sendRequest() {
            fetch('/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').value = JSON.stringify(data, null, 2);
                });
        }

        function stopServices() {
            fetch('/shutdown')  // Optional: Implement this in service1.py to stop the service
                .then(response => alert("System shutting down"));
        }
    </script>
</head>
<body>
    <h1>Service Gateway</h1>
    <button onclick="sendRequest()">REQUEST</button>
    <button onclick="stopServices()">STOP</button>
    <textarea id="output" rows="10" cols="50"></textarea>
</body>
</html>
